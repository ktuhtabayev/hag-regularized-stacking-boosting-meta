[project]
name = "hag-regularized-stacking-boosting-meta"
version = "0.1.0"
description = "HAG-based regularized stacking boosting ensemble with a META classifier, margin analysis, and a PyQt6 GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
  { name = "Kudratillo Tuhtabayev", email = "ktuhtabayev@gmail.com" }
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "PyQt6>=6.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# resources/ holds research material (article, Excel experiments), not project code
extend-exclude = ["resources"]

[tool.ruff.lint]
# Correctness-focused set (pycodestyle errors + pyflakes), pinned so results don't change with ruff's defaults
select = ["E4", "E7", "E9", "F"]
