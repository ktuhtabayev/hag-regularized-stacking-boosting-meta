# ============================================================
# Experiments (grid/ablations) for long-term use
# This file is designed so you can later add train/predict/eval.
# For now it can be used by scripts/run_experiments.py for demos.
# ============================================================

base_config: "configs/default.yaml"

runs:
  - name: "baseline_identity"
    overrides:
      hag:
        alpha: 0.3
        majorizing:
          name: "identity"
          params: {}

  - name: "sigmoid_default"
    overrides:
      hag:
        alpha: 0.3
        majorizing:
          name: "sigmoid"
          params: {k: 1.0, x0: 0.0}

  - name: "logistic_stronger"
    overrides:
      hag:
        alpha: 0.3
        majorizing:
          name: "logistic"
          params: {k: 2.0, x0: 0.0}

  - name: "quadratic_small"
    overrides:
      hag:
        alpha: 0.3
        majorizing:
          name: "quadratic"
          params: {a: 0.5, b: 0.0, c: 0.0}

  - name: "exponential_small"
    overrides:
      hag:
        alpha: 0.3
        majorizing:
          name: "exponential"
          params: {k: 0.5, x0: 0.0, scale: 1.0}

  - name: "piecewise_linear_example"
    overrides:
      hag:
        alpha: 0.3
        majorizing:
          name: "piecewise_linear"
          params:
            x: [-2, 0, 2]
            y: [ 0, 1, 0]

